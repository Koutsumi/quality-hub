services:
  frontend:
    image: node:20-alpine
    container_name: react_dev_container
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules # Isso é crucial: isola os pacotes do container
    # O comando abaixo garante que, se não houver pacotes, ele instala antes de rodar
    command: sh -c "npm install && npm run dev"